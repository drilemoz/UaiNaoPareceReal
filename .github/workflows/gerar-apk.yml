name: Gerar APK Uai Nao Parece Real
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar_release:
        description: 'Publicar Release com APK de produção, caso assinado'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  android:
    name: Testar, gerar APK e opcionalmente AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      # Não presumir que sdkmanager venha no PATH do runner ubuntu-latest.
      # A ação prepara cmdline-tools, licenças e caminhos do SDK.
      - name: Disponibilizar Android SDK e sdkmanager
        uses: android-actions/setup-android@v4
      - name: Instalar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
      - name: Preparar projeto Android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/prepare_android.sh
      - name: Instalar dependências
        run: flutter pub get
      - name: Validar fonte e política de credenciais
        run: python3 tools/validate_source.py
      - name: Analisar Dart
        run: flutter analyze
      - name: Testes Flutter
        run: flutter test
      - name: APK de teste ARM64 (sem Secrets)
        run: flutter build apk --debug --target-platform android-arm64
      - name: Exportar APK de teste (arquivo .apk)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2-debug.apk
          sha256sum dist/*.apk > dist/APK-SHA256.txt
      - name: Upload APK de teste para Actions
        uses: actions/upload-artifact@v4
        with:
          name: Uai-Nao-Parece-Real-v0.1.0-alpha.2-debug-apk
          path: |
            dist/*.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verificar Secrets completos para release
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Sem os 4 Secrets: somente APK Debug. Para Play Console exige assinatura e AAB.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: APK de produção assinado ARM64
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64
      - name: AAB assinado para Google Play
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release
      - name: Exportar APK e AAB assinados
        if: steps.signing.outputs.available == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.aab
          sha256sum dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.apk dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.aab > dist/RELEASE-SHA256.txt
      - name: Upload APK e AAB assinados
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Uai-Nao-Parece-Real-v0.1.0-alpha.2-signed
          path: |
            dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.apk
            dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.aab
            dist/RELEASE-SHA256.txt
          if-no-files-found: error
      - name: Publicar arquivos .apk e .aab diretamente no GitHub Releases
        if: steps.signing.outputs.available == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.2
          name: Uai, Não Parece Real alpha.2
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.apk
            dist/Uai-Nao-Parece-Real-v0.1.0-alpha.2.aab
