name: Gerar APK Uai Nao Parece Real
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Testar, gerar APK e opcionalmente AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      # Não presumir que sdkmanager venha no PATH do runner ubuntu-latest.
      # A ação prepara cmdline-tools, licenças e caminhos do SDK.
      - name: Disponibilizar Android SDK e sdkmanager
        uses: android-actions/setup-android@v4
      - name: Instalar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
      - name: Preparar projeto Android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/prepare_android.sh
      - name: Instalar dependências
        run: flutter pub get
      - name: Validar fonte e política de credenciais
        run: python3 tools/validate_source.py
      - name: Testar validador de APK (inclui rejeicao de artifact ZIP)
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Analisar Dart
        run: flutter analyze
      - name: Testes Flutter
        run: flutter test
      - name: APK de teste ARM64 (sem Secrets)
        run: flutter build apk --debug --target-platform android-arm64
      - name: Exportar APK de teste (arquivo .apk)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4-debug.apk
          sha256sum dist/*.apk > dist/APK-SHA256.txt
      - name: Verificar integridade do APK Debug (arquivo real)
        run: python3 tools/check_apk.py dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4-debug.apk
      - name: Verificar Secrets completos para release
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Sem os 4 Secrets: somente APK Debug. Para Play Console exige assinatura e AAB.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: APK de produção assinado ARM64
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64
      - name: AAB assinado para Google Play
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release
      - name: Exportar APK e AAB assinados
        if: steps.signing.outputs.available == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.aab
          sha256sum dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.apk dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.aab > dist/RELEASE-SHA256.txt
      - name: Verificar integridade do APK Release
        if: steps.signing.outputs.available == 'true'
        run: python3 tools/check_apk.py dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.apk
      # Todo artifact de GitHub Actions e baixado como ZIP pela API.
      # O GitHub Manager precisa receber o arquivo APK direto, via Releases.
      - name: Preparar APK direto para GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/publicar
          if [[ "${{ steps.signing.outputs.available }}" == 'true' ]]; then
            cp dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.apk dist/publicar/Uai-Nao-Parece-Real-v0.1.0-alpha.4-release.apk
            cp dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4.aab dist/publicar/
            echo 'APK Release assinado + AAB foram preparados.' >> "$GITHUB_STEP_SUMMARY"
          else
            cp dist/Uai-Nao-Parece-Real-v0.1.0-alpha.4-debug.apk dist/publicar/
            echo 'APK Debug de teste (sem Secrets) foi preparado. Nao usar na Play Store.' >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum dist/publicar/* > dist/publicar/SHA256SUMS.txt
          python3 tools/check_apk.py "$(find dist/publicar -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh dist/publicar/
      - name: Publicar APK direto no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.4
          target_commitish: ${{ github.sha }}
          name: Uai, Não Parece Real 0.1.0-alpha.4
          prerelease: true
          draft: false
          body_path: RELEASE_NOTES.md
          files: dist/publicar/*
          fail_on_unmatched_files: true
